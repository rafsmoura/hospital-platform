server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hospital}
    username: ${DB_USERNAME:hospital}
    password: ${DB_PASSWORD:local-dev-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification
  flyway:
    table: notification_flyway_schema_history
    schemas: notification
    default-schema: notification
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hospital}
    password: ${RABBITMQ_PASSWORD:local-dev-only}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

notification:
  max-retries: ${NOTIFICATION_MAX_RETRIES:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

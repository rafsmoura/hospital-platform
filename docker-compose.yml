services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hospital}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-dev-only}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduling-service:
    build:
      context: .
      dockerfile: scheduling-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital}"
      DB_USERNAME: ${POSTGRES_USER:-hospital}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-hospital}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-dev-only}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  history-service:
    build:
      context: .
      dockerfile: history-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital}"
      DB_USERNAME: ${POSTGRES_USER:-hospital}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-hospital}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-dev-only}
      HISTORY_MAX_RETRIES: ${HISTORY_MAX_RETRIES:-3}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hospital}"
      DB_USERNAME: ${POSTGRES_USER:-hospital}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-hospital}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-dev-only}
      NOTIFICATION_MAX_RETRIES: ${NOTIFICATION_MAX_RETRIES:-3}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  rabbitmq_data:
